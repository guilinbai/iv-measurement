# ============================================================================
#  4 路 IV 测量系统 · 上位机配置
#  ---------------------------------------------------------------------------
#  带 ★ 的值是这台电脑上实测/推荐值（DMM6500 两台 + Arduino Nano 都在线）
#  修改后重启程序生效
# ============================================================================

storage:
  # 数据根目录：程序会在下面按天自动建子文件夹，如 D:\IV_data\2026-10-30\
  dir: "D:/IV_data"
  write_csv_realtime: true     # ★ 边测边写 CSV 副本（防"忘记导出"，崩溃/断电也不怕）
  verify_on_exit: true         # 关闭时校验 CSV 与数据库是否一致，缺则补齐
  archive_daily: false         # 每天 00:05 归档前一天（可选）

acquisition:
  interval_s: 2.0              # ★ 采样间隔 = 周期（相邻两轮开始时刻之差）
  channels: 4                  # 通道数
  # 采集范围固定：每轮 4 路 × (V+I) = 8 项，不做通道选择
  # 空通道照测，事后按 ch 字段筛掉即可

devices:
  # ---- 测电压的表（当前功能应为 VOLT:DC）----
  dmm_voltage:
    resource: "USB0::0x05E6::0x6500::04587682::INSTR"   # ★ 实测地址
    idn_serial: "04587682"                              # 用于断线后重新识别
    nplc: 1                     # 1 NPLC ≈ 20 ms/次（实测 :READ? 约 25 ms）
    autozero: true              # 自动调零（小信号建议开；每 5 次读数会多花约 20 ms）
    meas_func: "VOLT:DC"
    # ★★ 量程策略：默认用【自动量程】★★
    #   锁死量程的话，被测值一旦超出该档位（如 Voc 超过 0.1 V）就会超量程报错。
    autorange: true
    # range: 0.1                # 仅当 autorange: false 时才生效（固定量程，谨慎用）

  # ---- 测电流的表（当前功能应为 CURR:DC）----
  dmm_current:
    resource: "USB0::0x05E6::0x6500::04468141::INSTR"   # ★ 实测地址
    idn_serial: "04468141"
    nplc: 1
    autozero: true
    meas_func: "CURR:DC"
    autorange: true             # ★★ 同上：默认自动量程，不锁死 ★★
    # range: 1e-05              # 仅当 autorange: false 时才生效

  # ---- 控制开关阵列的 Arduino ----
  arduino:
    port: ""                    # 留空 = 自动探测（推荐，因为 USB 会重新枚举换号）
    baud: 115200
    timeout_s: 1.0
    heartbeat_s: 5              # 每隔几秒发一次 PING 喂看门狗（固件 10 s 超时）

  # ==== 温度采集器（TA612，USB-串口，9600 8N1）====
  # 协议：帧头 0x55AA + 指令 + 帧长 + 4 通道数据(16bit×4) + Sum
  #       温度 = 原始值 / 10，单位 ℃；校验 = 从帧头起累加取低 8 位
  tasensor:
    enabled: true
    port: "COM4"                # ★ 实测：TA612 在此口
    baud: 9600
    timeout_s: 1.0
    # 采样节奏（温度变化慢，不需要跟测量轮同频）
    interval_s: 5.0             # 每 5 秒采一次温度
    channels: [1, 2]            # ★ 只用 ch1/ch2（ch3/ch4 未接传感器，实测返回 28000）
    invalid_above: 100.0        # 超过这个值视为无效（未接传感器），不入库

  # ==== 直流电压源（Wanptek，MODBUS-RTU）用于驱动 ch1/ch2 温差 ====
  # ★ 实测：波特率 2400（默认）、从站地址 0（默认）、数据小端
  #   设备规格 31V/5.2A；寄存器值换算：电压/100、电流/1000（VPOD=0、IPOD=0）
  powersupply:
    enabled: true
    port: "COM13"
    baud: 2400                  # ★ 实测（不是 9600！）
    addr: 0                     # ★ 实测（默认 0，不是 1）
    protocol: "modbus"          # modbus（真机） / none（dry-run 只记录不发送）
    settle_s: 2.0               # 改电压后等待热稳定
    max_voltage: 31.0           # ★ 设备实测最大 31V；超过直接拒绝
    off_on_exit: false          # 退出程序时是否关输出（false=保持，免得打断控温实验）

timing:
  # 与固件里的值保持一致（仅用于"本轮耗时估算 + 间隔保护"，不用于实际控制）
  t_open_ms: 30
  t_settle_ms: 80
  t_window_ms: 80               # ★ 80 ms：实测读数约 25 ms，但"自动调零"每 5 次会到 43 ms，
                                #    自动量程切换时更慢 → 留足余量（固件里也改成了 80）
  t_off_ms: 20
  switch_overhead_ms: 40        # 一轮内两次耦合器切换的总开销
  # 由以上推出：一轮 ≈ 8×(30+80+80+20+10) + 40 = 1800 ms
  # 间隔保护阈值：若 interval_s < 一轮耗时 × 1.2 (=2.16 s) 就红色警告
  # → 采样间隔建议用 2.5 s（或把 T_SETTLE 调小以压缩一轮耗时）

ui:
  refresh_hz: 3                 # 界面刷新率（降采样后绘图耗时与数据量无关）
  default_view: "1h"            # 10m / 1h / 1d / 7d
  downsample_buckets: 1600      # 降采样后的目标点数（≈ 屏幕像素宽）
