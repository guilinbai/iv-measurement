  <text x="40" y="44" font-size="24" font-weight="bold">四路测量板 · PCB 布局图（俯视，100 × 80 mm，2 层）</text>
  <text x="40" y="74" font-size="14" fill="#555">核心：14 只光耦横跨中间的隔离带 —— 左侧全部是控制侧，右侧全部是测量侧，两侧铜箔永不连通</text>

