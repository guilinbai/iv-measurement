  <text x="640" y="330" font-size="10" text-anchor="middle" fill="#ccc">1=+5V  2=GND</text>
  <circle cx="622" cy="342" r="5" fill="#9e9e9e"/><circle cx="658" cy="342" r="5" fill="#9e9e9e"/>

