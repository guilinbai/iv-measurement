  <!-- 图例 -->
  <rect x="40" y="740" width="1100" height="150" rx="10" fill="#fff8e6" stroke="#e0b000"/>
  <text x="60" y="768" font-size="15" font-weight="bold" fill="#8a6100">看这张图的三个要点</text>
  <text x="60" y="794" font-size="13" fill="#333">① <tspan font-weight="bold" fill="#c0392b">14 只黑色小方块 = 14 只光耦</tspan>，它们横躺在粉色隔离带上：上方两只脚（1/2 脚，LED 侧）朝控制侧，下方两只脚（3/4 脚，输出侧）朝测量侧。</text>
  <text x="60" y="818" font-size="13" fill="#333">② <tspan font-weight="bold">U1~U12</tspan> 是 4 个通道（每通道 3 只：选通A／选通B／短接），<tspan font-weight="bold">U13/U14</tspan>（橙色）是模式耦合器（切万用表电流／电压端口）。</text>
  <text x="60" y="842" font-size="13" fill="#333">③ 走线颜色：<tspan fill="#c0392b">红=母线HI</tspan>、<tspan fill="#78909c">灰蓝=母线LO</tspan>、<tspan fill="#c8a415">黄=器件A/B线</tspan>、<tspan fill="#8e44ad">紫=万用表线</tspan>；控制线与电源走左上半区，<tspan font-weight="bold" fill="#c0392b">测量侧不覆铜</tspan>。</text>
  <text x="60" y="870" font-size="13" fill="#555">完整网表（哪个引脚连哪个网络）见《9-PCB打板与四路板设计.md》§3.4；本图只画"元件摆在哪、主干怎么走"，细线在 EDA 里照网表连。</text>
</svg>
