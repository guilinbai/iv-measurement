<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" font-family="Microsoft YaHei,SimHei,sans-serif">
  <style>
    path{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .cb{stroke:#1a4d8f;stroke-width:2.5}
    .co{stroke:#e08a00;stroke-width:3}
    .cm{stroke:#1e7a3c;stroke-width:2.5}
    .ch{stroke:#c0392b;stroke-width:3.5}
    .cl{stroke:#2c3e50;stroke-width:3.5}
    .cp{stroke:#7d3c98;stroke-width:2.5}
    text{fill:#111}
  </style>
  <rect width="1440" height="1170" fill="#ffffff"/>

  <text x="40" y="46" font-size="25" font-weight="bold">4 路 IV 测量系统 · 整体结构图（面包板方案）</text>
  <text x="40" y="78" font-size="15" fill="#555">控制侧（Arduino + 14 只光耦的 LED 回路，含 14 只 1kΩ 限流电阻）与测量侧（器件 + 母线 + 万用表）完全隔离，两侧不共地</text>

  <!-- ============ 控制侧 ============ -->
  <rect x="30" y="100" width="1380" height="300" rx="12" fill="#f2f7ff" stroke="#b9cbe6" stroke-width="1.5"/>
  <text x="52" y="130" font-size="17" font-weight="bold" fill="#1a4d8f">① 控制侧（低压逻辑，5 V）</text>

  <rect x="60" y="150" width="215" height="200" rx="8" fill="#e8f0fb" stroke="#33507a" stroke-width="2"/>
  <text x="167" y="180" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a4d8f">Arduino Nano</text>
  <text x="80" y="208" font-size="13" fill="#33507a">D2 → 通道1 选通</text>
  <text x="80" y="228" font-size="13" fill="#33507a">D3 → 通道1 短接</text>
  <text x="80" y="248" font-size="13" fill="#33507a">D4 / D5 → 通道2</text>
  <text x="80" y="268" font-size="13" fill="#33507a">D6 / D7 → 通道3</text>
  <text x="80" y="288" font-size="13" fill="#33507a">D8 / D9 → 通道4</text>
  <text x="80" y="308" font-size="13" fill="#33507a">D10 / D11 → 模式耦合器</text>
  <text x="80" y="332" font-size="13" font-weight="bold" fill="#7d3c98">GND = 控制侧地（不接测量侧）</text>

  <path class="cb" d="M275 250 H400"/>
  <path d="M400 244 L416 250 L400 256" fill="#1a4d8f"/>
  <text x="278" y="240" font-size="13" font-weight="bold" fill="#1a4d8f">10 路控制线</text>
  <text x="278" y="260" font-size="12" fill="#1a4d8f">D2~D11</text>
  <text x="278" y="280" font-size="12" fill="#1a4d8f">每路经 1kΩ</text>
  <text x="278" y="300" font-size="12" fill="#1a4d8f">接光耦 LED</text>

  <rect x="420" y="140" width="640" height="240" rx="8" fill="#fffaf0" stroke="#e08a00" stroke-width="2.5"/>
  <text x="440" y="170" font-size="16" font-weight="bold" fill="#a35b00">14 只光耦（AQY212EH，DIP-4 直插）</text>
  <text x="440" y="192" font-size="13" fill="#a35b00">每只光耦的 <tspan font-weight="bold" fill="#c0392b">LED 侧各串一只 1kΩ</tspan> 限流电阻（共 14 只）</text>

  <rect x="440" y="210" width="108" height="100" rx="5" fill="#fff" stroke="#e08a00"/>
  <text x="494" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#a35b00">通道 1</text>
  <text x="494" y="254" font-size="12" text-anchor="middle" fill="#555">光耦 1/2/3</text>
  <text x="494" y="276" font-size="12" text-anchor="middle" fill="#c0392b">1kΩ × 3</text>
  <text x="494" y="298" font-size="12" text-anchor="middle" fill="#1a4d8f">D2 / D3</text>

  <rect x="558" y="210" width="108" height="100" rx="5" fill="#fff" stroke="#e08a00"/>
  <text x="612" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#a35b00">通道 2</text>
  <text x="612" y="254" font-size="12" text-anchor="middle" fill="#555">光耦 4/5/6</text>
  <text x="612" y="276" font-size="12" text-anchor="middle" fill="#c0392b">1kΩ × 3</text>
  <text x="612" y="298" font-size="12" text-anchor="middle" fill="#1a4d8f">D4 / D5</text>

  <rect x="676" y="210" width="108" height="100" rx="5" fill="#fff" stroke="#e08a00"/>
  <text x="730" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#a35b00">通道 3</text>
  <text x="730" y="254" font-size="12" text-anchor="middle" fill="#555">光耦 7/8/9</text>
  <text x="730" y="276" font-size="12" text-anchor="middle" fill="#c0392b">1kΩ × 3</text>
  <text x="730" y="298" font-size="12" text-anchor="middle" fill="#1a4d8f">D6 / D7</text>

  <rect x="794" y="210" width="108" height="100" rx="5" fill="#fff" stroke="#e08a00"/>
  <text x="848" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#a35b00">通道 4</text>
  <text x="848" y="254" font-size="12" text-anchor="middle" fill="#555">光耦 10/11/12</text>
  <text x="848" y="276" font-size="12" text-anchor="middle" fill="#c0392b">1kΩ × 3</text>
  <text x="848" y="298" font-size="12" text-anchor="middle" fill="#1a4d8f">D8 / D9</text>

  <rect x="912" y="210" width="128" height="100" rx="5" fill="#fdf0ff" stroke="#7d3c98"/>
  <text x="976" y="232" font-size="12" font-weight="bold" text-anchor="middle" fill="#7d3c98">模式耦合器</text>
  <text x="976" y="254" font-size="12" text-anchor="middle" fill="#555">光耦 13/14</text>
  <text x="976" y="276" font-size="12" text-anchor="middle" fill="#c0392b">1kΩ × 2</text>
  <text x="976" y="298" font-size="12" text-anchor="middle" fill="#1a4d8f">D10 / D11</text>

  <text x="440" y="336" font-size="14" font-weight="bold" fill="#c0392b">共 14 只光耦　⟷　共 14 只 1kΩ（每只光耦的 1 脚各一只）</text>
  <text x="440" y="362" font-size="12" fill="#a35b00">LED 电流 I ≈ (5 V − 1.25 V) ÷ 1 kΩ ≈ 3.75 mA；所有光耦的 2 脚统一接控制侧 GND</text>

  <!-- ============ 隔离带 ============ -->
  <path d="M30 428 H1410" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="12 7"/>
  <rect x="520" y="414" width="400" height="28" rx="6" fill="#f6ecfb" stroke="#8e44ad"/>
  <text x="720" y="434" font-size="14" font-weight="bold" text-anchor="middle" fill="#6c3483">光隔离边界 —— 两侧不共地，光耦是唯一桥梁</text>

  <!-- ============ 测量侧 ============ -->
  <rect x="30" y="460" width="1380" height="550" rx="12" fill="#f2fbf4" stroke="#a9d5b5" stroke-width="1.5"/>
  <text x="52" y="490" font-size="17" font-weight="bold" fill="#1e7a3c">② 测量侧（浮空，不接控制侧 GND）</text>

  <rect x="70" y="520" width="205" height="105" rx="8" fill="#eaf7ee" stroke="#1e7a3c" stroke-width="2"/>
  <text x="172" y="546" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e7a3c">通道 1</text>
  <text x="172" y="570" font-size="12" text-anchor="middle" fill="#3a7a55">光耦1（选通A）→ 母线 HI</text>
  <text x="172" y="590" font-size="12" text-anchor="middle" fill="#3a7a55">光耦2（选通B）→ 母线 LO</text>
  <text x="172" y="610" font-size="12" text-anchor="middle" fill="#3a7a55">光耦3（短接）跨器件 A-B</text>

  <rect x="305" y="520" width="205" height="105" rx="8" fill="#eaf7ee" stroke="#1e7a3c" stroke-width="2"/>
  <text x="407" y="546" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e7a3c">通道 2</text>
  <text x="407" y="570" font-size="12" text-anchor="middle" fill="#3a7a55">光耦4（选通A）→ 母线 HI</text>
  <text x="407" y="590" font-size="12" text-anchor="middle" fill="#3a7a55">光耦5（选通B）→ 母线 LO</text>
  <text x="407" y="610" font-size="12" text-anchor="middle" fill="#3a7a55">光耦6（短接）跨器件 A-B</text>

  <rect x="540" y="520" width="205" height="105" rx="8" fill="#eaf7ee" stroke="#1e7a3c" stroke-width="2"/>
  <text x="642" y="546" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e7a3c">通道 3</text>
  <text x="642" y="570" font-size="12" text-anchor="middle" fill="#3a7a55">光耦7（选通A）→ 母线 HI</text>
  <text x="642" y="590" font-size="12" text-anchor="middle" fill="#3a7a55">光耦8（选通B）→ 母线 LO</text>
  <text x="642" y="610" font-size="12" text-anchor="middle" fill="#3a7a55">光耦9（短接）跨器件 A-B</text>

  <rect x="775" y="520" width="205" height="105" rx="8" fill="#eaf7ee" stroke="#1e7a3c" stroke-width="2"/>
  <text x="877" y="546" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e7a3c">通道 4</text>
  <text x="877" y="570" font-size="12" text-anchor="middle" fill="#3a7a55">光耦10（选通A）→ 母线 HI</text>
  <text x="877" y="590" font-size="12" text-anchor="middle" fill="#3a7a55">光耦11（选通B）→ 母线 LO</text>
  <text x="877" y="610" font-size="12" text-anchor="middle" fill="#3a7a55">光耦12（短接）跨器件 A-B</text>

  <rect x="70" y="665" width="205" height="56" rx="6" fill="#fff" stroke="#1e7a3c" stroke-dasharray="6 4"/>
  <text x="172" y="700" font-size="13" text-anchor="middle" fill="#1e7a3c">器件 1（A / B 两端）</text>
  <rect x="305" y="665" width="205" height="56" rx="6" fill="#fff" stroke="#1e7a3c" stroke-dasharray="6 4"/>
  <text x="407" y="700" font-size="13" text-anchor="middle" fill="#1e7a3c">器件 2</text>
  <rect x="540" y="665" width="205" height="56" rx="6" fill="#fff" stroke="#1e7a3c" stroke-dasharray="6 4"/>
  <text x="642" y="700" font-size="13" text-anchor="middle" fill="#1e7a3c">器件 3</text>
  <rect x="775" y="665" width="205" height="56" rx="6" fill="#fff" stroke="#1e7a3c" stroke-dasharray="6 4"/>
  <text x="877" y="700" font-size="13" text-anchor="middle" fill="#1e7a3c">器件 4</text>

  <path class="cm" d="M172 625 V665"/>
  <path class="cm" d="M407 625 V665"/>
  <path class="cm" d="M642 625 V665"/>
  <path class="cm" d="M877 625 V665"/>

  <!-- 母线 HI -->
  <path class="ch" d="M150 721 V800"/>
  <path class="ch" d="M385 721 V800"/>
  <path class="ch" d="M620 721 V800"/>
  <path class="ch" d="M855 721 V800"/>
  <path class="ch" d="M150 800 H1060"/>
  <text x="600" y="792" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">母线 HI（4 路"选通A光耦"的输出端汇集于此）</text>

  <!-- 母线 LO -->
  <path class="cl" d="M190 721 V870"/>
  <path class="cl" d="M425 721 V870"/>
  <path class="cl" d="M660 721 V870"/>
  <path class="cl" d="M895 721 V870"/>
  <path class="cl" d="M190 870 H1055"/>
  <text x="600" y="862" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">母线 LO（4 路"选通B光耦"的输出端汇集于此）</text>

  <!-- 模式耦合器 -->
  <rect x="1075" y="700" width="195" height="130" rx="8" fill="#fdf0ff" stroke="#7d3c98" stroke-width="2.5"/>
  <text x="1172" y="728" font-size="14" font-weight="bold" text-anchor="middle" fill="#7d3c98">模式耦合器</text>
  <text x="1172" y="752" font-size="12" text-anchor="middle" fill="#555">光耦13（电流）</text>
  <text x="1172" y="772" font-size="12" text-anchor="middle" fill="#555">光耦14（电压）</text>
  <text x="1172" y="798" font-size="11" text-anchor="middle" fill="#c0392b">两者绝不同时闭合</text>
  <path class="ch" d="M1060 800 H1075"/>

  <!-- DMM -->
  <rect x="1075" y="860" width="300" height="110" rx="8" fill="#eef4fb" stroke="#33507a" stroke-width="2.5"/>
  <text x="1225" y="888" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a4d8f">DMM6500（三个输入端口）</text>
  <text x="1092" y="914" font-size="12" fill="#33507a">电流端口 ← 光耦13</text>
  <text x="1092" y="936" font-size="12" fill="#33507a">电压端口 ← 光耦14</text>
  <text x="1240" y="914" font-size="12" fill="#33507a">公共端（黑）</text>
  <text x="1240" y="936" font-size="12" font-weight="bold" fill="#2c3e50">← 母线 LO</text>

  <path class="cp" d="M1140 830 V860"/>
  <path class="cp" d="M1210 830 V860"/>
  <path class="cl" d="M1055 870 V1010 H1345 V970"/>
  <circle cx="1345" cy="970" r="5" fill="#2c3e50"/>
  <text x="700" y="1032" font-size="12" fill="#2c3e50">母线 LO 绕过模式耦合器，直接到万用表公共端</text>

  <!-- 要点 -->
  <rect x="30" y="1040" width="1380" height="112" rx="10" fill="#fff8e6" stroke="#e0b000"/>
  <text x="52" y="1066" font-size="15" font-weight="bold" fill="#8a6100">要点</text>
  <text x="52" y="1090" font-size="13" fill="#333">· 每通道 3 只光耦：选通A（接母线 HI）、选通B（接母线 LO）、短接（跨器件 A-B）→ 4 路 = 12 只</text>
  <text x="52" y="1112" font-size="13" fill="#333">· 再加 2 只模式耦合器（切万用表的电流/电压端口）= <tspan font-weight="bold" fill="#c0392b">共 14 只光耦</tspan>；每只光耦的 1 脚各配一只 <tspan font-weight="bold" fill="#c0392b">1kΩ（共 14 只）</tspan></text>
  <text x="52" y="1134" font-size="13" fill="#333">· 控制侧 GND 与测量侧母线 LO <tspan font-weight="bold" fill="#c0392b">绝对不能相连</tspan>（否则光耦隔离失效、引入地环流）；逐脚接线见《5-面包板排线教程.md》</text>
  <text x="52" y="1134" font-size="13" fill="#333" text-anchor="end" transform="translate(1390,0)">· 线色：<tspan fill="#c0392b">红=母线HI</tspan>、<tspan fill="#2c3e50">深蓝=母线LO</tspan>、<tspan fill="#1a4d8f">蓝=控制</tspan>（交叉处不相连）</text>
</svg>
